name: PulseNOC Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # BACKEND PIPELINE (Check -> Test -> Build)
  # ============================================================================
  be-check:
    name: BE 1. Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

  be-test:
    name: BE 2. Test Suite
    needs: be-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Jest Test Suite
        run: npm run test -- --passWithNoTests

  be-build:
    name: BE 3. Production Build
    needs: be-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run NestJS Production Build
        run: npm run build

  # ============================================================================
  # FRONTEND PIPELINE (Check -> Test -> Build)
  # ============================================================================
  fe-check:
    name: FE 1. Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  fe-test:
    name: FE 2. Type Check & Test
    needs: fe-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Strict Type Check
        run: npx tsc --noEmit

  fe-build:
    name: FE 3. Production Build
    needs: fe-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Next.js Production Build
        run: npm run build

  # ============================================================================
  # DEPLOYMENT PIPELINE (Deploy to Debian Laptop on push to main)
  # ============================================================================
  deploy:
    name: Deploy to Server Laptop
    needs: [be-build, fe-build]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Ensure Environment Configuration
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Created initial .env from .env.example"
            else
              touch .env
            fi
          fi

      - name: Build and Start Containers
        run: |
          echo "Deploying PulseNOC stack on Debian host..."
          docker compose down --remove-orphans || true
          docker compose up -d --build --remove-orphans

      - name: Verify Running Containers
        run: |
          echo "Verifying container runtime status..."
          sleep 5
          docker compose ps
          echo "PulseNOC deployment verified successfully!"
